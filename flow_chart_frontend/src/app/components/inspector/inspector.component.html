<aside class="inspector">
  <h3>Inspector</h3>
  <div *ngIf="!sel" class="muted">Select a node to edit.</div>
  <div *ngIf="sel" class="panel">
    <label>
      <div>Label</div>
      <input [(ngModel)]="sel.label" (ngModelChange)="update()">
    </label>
    <label>
      <div>Type</div>
      <select [(ngModel)]="sel.type" (ngModelChange)="update()">
        <option value="action">action</option>
        <option value="outcome">outcome</option>
      </select>
    </label>
    <div class="grid">
      <label>
        <div>Width</div>
        <input type="number" [(ngModel)]="sel.width" (ngModelChange)="update()">
      </label>
      <label>
        <div>Height</div>
        <input type="number" [(ngModel)]="sel.height" (ngModelChange)="update()">
      </label>
    </div>
  </div>
</aside>
